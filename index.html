<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASHGRID NETWORKS - Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none; /* Hide default cursor for immersive effect */
        }

        .matrix-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            background: #000;
            /* Force hardware acceleration */
            transform: translateZ(0);
            will-change: transform;
        }

        .content-container {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .logo-container {
            background: rgba(0, 0, 0, 0.85);
            padding: 60px 80px;
            border-radius: 20px;
            border: 2px solid #00ff41;
            box-shadow:
                0 0 30px rgba(0, 255, 65, 0.3),
                inset 0 0 30px rgba(0, 255, 65, 0.1);
            /* Simplified backdrop filter for better Safari performance */
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .main-title {
            font-size: 4.5rem;
            font-weight: 900;
            color: #00ff41;
            text-shadow:
                0 0 10px #00ff41,
                0 0 20px #00ff41,
                0 0 30px #00ff41;
            letter-spacing: 8px;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
            /* Optimize for Safari */
            -webkit-font-smoothing: antialiased;
        }

        .subtitle {
            font-size: 2.2rem;
            font-weight: 400;
            color: #66ff66;
            letter-spacing: 12px;
            text-shadow:
                0 0 5px #66ff66,
                0 0 10px #66ff66;
            animation: pulse 3s ease-in-out infinite;
            -webkit-font-smoothing: antialiased;
        }

        .announcement {
            background: rgba(0, 0, 0, 0.9);
            padding: 25px 40px;
            border-radius: 15px;
            border: 2px solid #ff6600;
            box-shadow:
                0 0 25px rgba(255, 102, 0, 0.4),
                inset 0 0 20px rgba(255, 102, 0, 0.1);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            max-width: 600px;
        }

        .announcement-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow:
                0 0 8px #ff6600,
                0 0 16px #ff6600;
            animation: bitcoinGlow 2.5s ease-in-out infinite alternate;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 10px #00ff41,
                    0 0 20px #00ff41,
                    0 0 30px #00ff41;
            }
            to {
                text-shadow:
                    0 0 15px #00ff41,
                    0 0 25px #00ff41,
                    0 0 35px #00ff41,
                    0 0 45px #00ff41;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes bitcoinGlow {
            from {
                text-shadow:
                    0 0 8px #ff6600,
                    0 0 16px #ff6600;
                transform: scale(1);
            }
            to {
                text-shadow:
                    0 0 12px #ff6600,
                    0 0 24px #ff6600,
                    0 0 32px #ff6600;
                transform: scale(1.02);
            }
        }

        @media (max-width: 768px) {
            .content-container {
                gap: 20px;
            }
            .logo-container {
                padding: 40px 30px;
            }
            .main-title {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            .subtitle {
                font-size: 1.2rem;
                letter-spacing: 6px;
            }
            .announcement {
                padding: 20px 25px;
                max-width: 90%;
            }
            .announcement-text {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            body {
                cursor: default; /* Show cursor on mobile */
            }
        }
    </style>
</head>
<body>
    <div class="matrix-container">
        <canvas id="matrix"></canvas>
    </div>

    <div class="content-container">
        <div class="logo-container">
            <div class="main-title">HASHGRID</div>
            <div class="subtitle">NETWORKS</div>
        </div>
        
        <div class="announcement">
            <div class="announcement-text">The Next Generation of Bitcoin Mining is Arriving Soon!</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        // Performance optimizations
        let animationId;
        let lastTime = 0;
        const targetFPS = 30;
        const frameDelay = 1000 / targetFPS;
        
        // Optimize canvas settings
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;

        // Mouse tracking
        let mouseX = 0;
        let mouseY = 0;
        let mouseTrail = [];
        const maxTrailLength = 15;

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            setupMatrix();
        }

        // Matrix setup
        let matrixChars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        let fontSize = 14;
        let columns, drops, cursorDrops;
        
        function setupMatrix() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            cursorDrops = [];
            
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * canvas.height;
            }
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Pre-calculate values for performance
        const trailAlpha = 'rgba(0, 0, 0, 0.08)';
        const fontString = fontSize + 'px monospace';
        const charCache = matrixChars.split('');
        const charCacheLength = charCache.length;

        // Cursor drop class for better organization
        class CursorDrop {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = Math.random() * 2 + 1;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
                this.char = charCache[Math.floor(Math.random() * charCacheLength)];
            }
            
            update() {
                this.y += this.speed;
                this.life -= this.decay;
                
                // Occasionally change character
                if (Math.random() < 0.1) {
                    this.char = charCache[Math.floor(Math.random() * charCacheLength)];
                }
            }
            
            draw() {
                if (this.life <= 0) return false;
                
                const alpha = Math.max(0, this.life);
                ctx.fillStyle = `rgba(0, 255, 65, ${alpha})`;
                ctx.fillText(this.char, this.x, this.y);
                
                return this.y < canvas.height + 50 && this.life > 0;
            }
        }

        function drawMatrix(currentTime) {
            // Frame rate limiting
            if (currentTime - lastTime < frameDelay) {
                animationId = requestAnimationFrame(drawMatrix);
                return;
            }
            lastTime = currentTime;
            
            // Create trailing effect
            ctx.fillStyle = trailAlpha;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Set font once
            ctx.font = fontString;

            // Draw main matrix drops
            ctx.fillStyle = '#00ff41';
            for (let i = 0; i < drops.length; i++) {
                const char = charCache[Math.floor(Math.random() * charCacheLength)];
                const intensity = Math.max(0.3, 1 - (drops[i] % 100) / 100);
                ctx.fillStyle = `rgba(0, 255, 65, ${intensity})`;
                ctx.fillText(char, i * fontSize, drops[i]);

                if (drops[i] > canvas.height && Math.random() > 0.975) {
                    drops[i] = -fontSize;
                }
                drops[i] += 0.8;
            }

            // Update and draw cursor drops
            cursorDrops = cursorDrops.filter(drop => {
                drop.update();
                return drop.draw();
            });

            // Draw mouse trail effect
            if (mouseTrail.length > 1) {
                for (let i = 0; i < mouseTrail.length - 1; i++) {
                    const alpha = (i / mouseTrail.length) * 0.5;
                    const size = (i / mouseTrail.length) * 8 + 2;
                    
                    ctx.fillStyle = `rgba(0, 255, 65, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(mouseTrail[i].x, mouseTrail[i].y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw cursor glow
            if (mouseTrail.length > 0) {
                const latest = mouseTrail[mouseTrail.length - 1];
                const gradient = ctx.createRadialGradient(latest.x, latest.y, 0, latest.x, latest.y, 20);
                gradient.addColorStop(0, 'rgba(0, 255, 65, 0.8)');
                gradient.addColorStop(0.5, 'rgba(0, 255, 65, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 255, 65, 0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(latest.x, latest.y, 20, 0, Math.PI * 2);
                ctx.fill();

                // Draw cursor character
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px monospace';
                const cursorChar = charCache[Math.floor(Date.now() / 200) % charCacheLength];
                ctx.fillText(cursorChar, latest.x - 4, latest.y + 4);
                ctx.font = fontString; // Reset font
            }

            animationId = requestAnimationFrame(drawMatrix);
        }

        // Enhanced mouse tracking
        function updateMousePosition(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Add to trail
            mouseTrail.push({ x: mouseX, y: mouseY, time: Date.now() });
            if (mouseTrail.length > maxTrailLength) {
                mouseTrail.shift();
            }
            
            // Remove old trail points
            const now = Date.now();
            mouseTrail = mouseTrail.filter(point => now - point.time < 500);
        }

        // Mouse event listeners
        canvas.addEventListener('mousemove', (e) => {
            updateMousePosition(e);
            
            // Create cursor drops around mouse position
            if (Math.random() < 0.7) {
                const offsetX = (Math.random() - 0.5) * 60;
                const offsetY = (Math.random() - 0.5) * 40;
                cursorDrops.push(new CursorDrop(mouseX + offsetX, mouseY + offsetY));
            }
            
            // Affect nearby matrix columns
            const col = Math.floor(mouseX / fontSize);
            const range = 3;
            for (let i = Math.max(0, col - range); i < Math.min(columns, col + range + 1); i++) {
                if (Math.random() > 0.8) {
                    drops[i] = Math.max(0, mouseY - Math.random() * 100);
                }
            }
        });

        // Handle mouse leave to clear trail
        canvas.addEventListener('mouseleave', () => {
            mouseTrail = [];
        });

        // Touch support for mobile
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            updateMousePosition(touch);
        });

        // Start animation
        animationId = requestAnimationFrame(drawMatrix);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });

        // Pause animation when page is not visible
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
            } else {
                animationId = requestAnimationFrame(drawMatrix);
            }
        });
    </script>
</body>
</html>
